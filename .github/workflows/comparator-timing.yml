name: Comparator timing (diagnostic)

# Times `lake comparator` with one kernel configuration per job, so that each gets its own
# six hours: Lean's kernel only, Lean + NanoDa, Lean + con-ron. Dispatched manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    name: Comparator with ${{ matrix.kernels }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        kernels: [lean-only, nanoda, con-ron]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 24G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run lake comparator with timestamps
        timeout-minutes: 335
        shell: bash
        env:
          KERNELS: ${{ matrix.kernels }}
        run: |
          prefix=$(lean --print-prefix)
          python3 - comparator.json "$RUNNER_TEMP/cfg.json" "$prefix" "$KERNELS" <<'PY'
          import json, sys
          src, dst, prefix, which = sys.argv[1:]
          c = json.load(open(src)); c.pop("enable_nanoda", None)
          bins = {"nanoda": f"{prefix}/bin/nanoda_bin", "con-ron": f"{prefix}/bin/con-ron"}
          c["external_kernels"] = {} if which == "lean-only" else {which: [bins[which]]}
          json.dump(c, open(dst, "w"), indent=2)
          PY
          cat "$RUNNER_TEMP/cfg.json"
          stamp() { while IFS= read -r l; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$l"; done; }
          echo "start" | stamp | tee "$RUNNER_TEMP/out.log"
          # Heartbeat every 10 minutes: each kernel/lean process with its CPU time, memory, and
          # bytes read so far (against the sizes of any export files), so a timeout shows progress.
          (
            while true; do
              sleep 600
              {
                echo "--- heartbeat"; free -m | sed -n 2,3p
                ps -eo pid,etime,time,rss,args --sort=-time | grep -E "nanoda|con-ron|leanchecker|leanexport|lean |comparator" | grep -v grep | head -8 | cut -c1-200
                for p in $(pgrep -f "nanoda_bin|con-ron|leanchecker|leanexport"); do
                  echo "pid $p read $(awk '/rchar/{print $2}' /proc/$p/io 2>/dev/null) bytes"
                done
                find / -xdev \( -name "*.export" -o -name "*.ndjson" \) -size +10M -printf "%s %p\n" 2>/dev/null | head -5
              } | stamp >> "$RUNNER_TEMP/out.log"
            done
          ) &
          lake exe cache get 2>&1 | tail -2 | stamp | tee -a "$RUNNER_TEMP/out.log"
          ( /usr/bin/time -v lake comparator --config "$RUNNER_TEMP/cfg.json" 2>&1; echo "exit $?" ) | stamp | tee -a "$RUNNER_TEMP/out.log"
      - name: Report timing
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/out.log"
          [ -f "$f" ] || { echo "::error title=no log::no log"; exit 0; }
          msg=$( (head -n 12 "$f"; echo ...; grep -iE "kernel|replay|check|nanoda|con-ron|build|Maximum resident|Elapsed|exit|heartbeat|read |export" "$f" | tail -n 30; echo ...; tail -n 12 "$f") | tail -c 3800 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Timing ${{ matrix.kernels }}::$msg"
