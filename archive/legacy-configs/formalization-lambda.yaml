# Formalization metadata for the lambda result (separate from formalization.yaml, which describes the mu(G) result).
# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Irrationality and an irrationality measure for lambda = G/2 - 5 pi^2/96"
  description: >-
    For Catalan's constant G = sum_{j>=0} (-1)^j/(2j+1)^2 and lambda = G/2 - 5 pi^2/96
    (so G - 5 pi^2/48 = 2 lambda), we prove that lambda is irrational and that
    |lambda - p/q| > q^(-(M+e)) for every e > 0, all large q and all p coprime to q, with
    M = 31682445459/409965000 (about 77.28); in particular |lambda - p/q| > q^(-78).
    The proof is an ell-adic Schur-complement nonvanishing argument, a Cauchy-determinant
    decay estimate and a kernel-checked rational certificate (K = 300, 27648 ray cells,
    2816 segment cells, 512 line cells) with D_cert = 31111/10000 and c_cert = 68726/10000.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J82", "11J72"]

related_formalizations:
  - id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/OAI/NumberTheory/Catalan"
    relationship: builds-on
    note: >-
      The definition of Catalan's constant (OAI.InternalCatalan.catalan, definitionally
      the series used here) is shared, and the prime number theorem in progressions is
      derived from the vendored PNT+ Wiener-Ikehara theorem and Mathlib's Dirichlet
      L-function results. The lambda development is otherwise independent.

status:
  scope: >-
    All eight advertised statements are fully proved (SolutionLambda.lean, via
    CatalanLambda/Final.lean). The development has no sorry and no native_decide.
    Axioms: propext, Classical.choice, Quot.sound only.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

fidelity:
  divergences: >-
    None known. lambda is written out with the series for G and Real.pi. The measure is stated
    for p coprime to q (Nat.Coprime p.natAbs q) and q >= q0, which is the standard form.

review:
  status: "self-assessed"
  reviewers: []

alignment:
  namespace: "CatalanLambdaChallenge"
  statements:
    - source: "Litsey (2026), irrationality of lambda"
      lean: "CatalanLambdaChallenge.lambda_irrational"
      module: "ChallengeLambda"
      status: proved
    - source: "Litsey (2026), irrationality measure of lambda, exponent M + e"
      lean: "CatalanLambdaChallenge.lambda_irrationalityMeasure"
      module: "ChallengeLambda"
      status: proved
      note: "M = 31682445459/409965000 = c_cert (4/(3 (D_cert - 313/105)) + 1)."
    - source: "Litsey (2026), round exponent 78"
      lean: "CatalanLambdaChallenge.lambda_irrationalityMeasure_78"
      module: "ChallengeLambda"
      status: proved
    - source: "Mirror constant lambda' = G/2 + 5 pi^2/96: irrationality (hence G + 5 pi^2/48 = 2 lambda' irrational)"
      lean: "CatalanLambdaChallenge.lambdaMirror_irrational"
      module: "ChallengeLambda"
      status: proved
      note: "Same certificate; mirror l = 1 mod 4 nonvanishing, mirror contour identity."
    - source: "Mirror constant lambda', irrationality measure exponent M + e (same M as lambda)"
      lean: "CatalanLambdaChallenge.lambdaMirror_irrationalityMeasure"
      module: "ChallengeLambda"
      status: proved
    - source: "Mirror constant lambda', round exponent 78"
      lean: "CatalanLambdaChallenge.lambdaMirror_irrationalityMeasure_78"
      module: "ChallengeLambda"
      status: proved
    - source: "G + 5 pi^2/48 = 2 lambda' is irrational"
      lean: "CatalanLambdaChallenge.catalan_add_irrational"
      module: "ChallengeLambda"
      status: proved
    - source: "Irrationality measure of G + 5 pi^2/48, round exponent 79"
      lean: "CatalanLambdaChallenge.catalan_add_irrationalityMeasure_79"
      module: "ChallengeLambda"
      status: proved

sources:
  - title: "Irrationality and an irrationality measure for G/2 - 5 pi^2/96"
    type: original-proof
    relationship: other
    note: >-
      Companion paper by S. Litsey (2026), LaTeX source and PDF in paper-lambda/. The paper
      proves the stronger bound mu(lambda) <= 57.85 using a Krylov determinant evaluation
      (Theorem A) that is not formalized; the Lean development proves exponent about 77.28.

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Sonnet 5.5 (Anthropic)"]
      framework: "Claude Code desktop with native Windows shell and file tools, coordinating subagents"
      tool_setup: >-
        Claude agents produced the mathematics (content, decay, nonvanishing, node removal,
        certificates), independent audits, the Lean development including the kernel-checked
        numerical certificate (decide +kernel, no native_decide), and the companion paper,
        using Python (python-flint/Arb, mpmath), Lean 4, Lake and Mathlib. The human author
        posed the problem, directed the work and checked the outcome.
      prompting_notes: >-
        High-level research and formalization directives from the author.
  notes: >-
    The repository infrastructure, vendored formalizations and certificate tooling of the
    companion mu(G) project, which this work reuses, were developed with Claude and OpenAI
    Codex as described in formalization.yaml.

acknowledgements: >-
  OpenAI's proof and Lean formalization of the irrationality of Catalan's constant; Lean 4,
  Mathlib and the PNT+ project; Arb (FLINT) for interval arithmetic.

