# Formalization metadata for ChallengeLai.lean and SolutionLai.lean (the measures for a zeta(3) + b zeta(4)
# and zeta(3)/pi^4); formalization.yaml describes the mu(G) result, formalization-hybrid.yaml the
# Löwner-determinant measures and formalization-zeta5.yaml the measure for zeta(5).
# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Irrationality measures for a zeta(3) + b zeta(4) and zeta(3)/pi^4"
  description: >-
    We prove mu(a zeta(3) + b zeta(4)) <= 34.14 for all integers a, b with
    b != 0, and mu(zeta(3)/pi^4) <= 55.50: |x - p/q| > q^(-mu) for every
    integer p and every sufficiently large integer q. The approximations are
    Lai's Hankel determinants J_n(a, b, X), used unchanged. A measure needs
    three estimates beyond Lai's linear independence proof. Decay on a
    neighbourhood of the constant, uniform in the direction (a, b), comes from
    a positive measure on a complex contour whose potential has a closed form
    through the Joukowski map, checked on 40 cells (D = 33.4401, neighbourhood
    exponent 42.94856306). The denominators are bounded at every prime by an
    exact law for the p-adic valuation, whose integral over the primes has a
    closed form (Lambda = 28.68723663). Nonvanishing is proved at the sizes tied
    to Lai's auxiliary primes and to two new families of primes, 3l = 7n + 1
    and 3l = 7n + 2, and a counting criterion with the prime number theorem in
    progressions turns it into a measure. All numerical bounds are ordinary
    kernel-checked rational proofs.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J82", "11J72"]

sources:
  - title: "Irrationality measures for a zeta(3) + b zeta(4) and zeta(3)/pi^4"
    type: original-proof
    relationship: other
    note: >-
      The companion paper by S. Litsey (2026), whose arguments the Lean
      development follows. LaTeX source and PDF are in paper-lai/
      (lai-measure-hexagon.tex is the single-file version).
  - title: "The linear independence of 1, zeta(3), and zeta(4)"
    authors:
      - "Li Lai"
    id: "arXiv:2610.06838"
    type: preprint
    location: "https://arxiv.org/abs/2610.06838"
    relationship: builds-on
    note: >-
      Supplies the Hankel determinant construction and the linear independence
      proof on which the measures are built.
    author_endorsement: not-contacted

related_formalizations: []

status:
  scope: >-
    ChallengeLai.lean imports only Mathlib and contains intentional proof
    placeholders. SolutionLai.lean supplies the proofs independently, from
    CatalanCore.Lai.lai_roots_of. Every theorem, proposition and lemma used in
    the proof of the companion paper's main theorem is formalized. The
    solution has no sorry and no native_decide; #print axioms reports only
    propext, Classical.choice and Quot.sound. comparator-lai.json configures
    lake comparator for these statements; the CI workflow does not run it.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5", "Claude Haiku 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents wrote the mathematics, Lean proofs, certificate generators and text, using Python, Lean 4, Lake and Mathlib.
  spend_usd: "subscription-based"
  notes: >-
    The agents worked at the request of the human author, who posed the
    problem, directed the work and is responsible for the submission.
    Certificates use decide +kernel, without native_decide or additional axioms.

fidelity:
  divergences: >-
    None known. zeta(3) and zeta(4) are written as sum_{k>=0} 1/(k+1)^3 and
    sum_{k>=0} 1/(k+1)^4, and pi is Mathlib's Real.pi. The plane statement takes
    integer coefficients a, b with b != 0, which covers every rational point
    with b != 0 after clearing denominators. The exponents 34.14 and 55.50 are
    represented exactly in R.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The statements in ChallengeLai.lean were checked against Theorem 1.1 of
    the companion paper, and the constants stated in the paper were checked
    against the Lean development. No independent human review has been
    performed.

alignment:
  namespace: "LaiIrrationalityMeasure"
  statements:
    - source: "Litsey, Irrationality measures for a zeta(3) + b zeta(4) and zeta(3)/pi^4 (2026), Theorem 1.1(a)"
      lean: "LaiIrrationalityMeasure.lai_plane_measure_34_14"
      module: "ChallengeLai"
      status: proved
      note: "a zeta(3) + b zeta(4), b != 0, exponent 34.14."
    - source: "Litsey, Irrationality measures for a zeta(3) + b zeta(4) and zeta(3)/pi^4 (2026), Theorem 1.1(b)"
      lean: "LaiIrrationalityMeasure.lai_ratio_measure_55_50"
      module: "ChallengeLai"
      status: proved
      note: "zeta(3)/pi^4, exponent 55.50."
