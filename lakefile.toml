name = "CatalanIrrationalityMeasure"
version = "0.1.0"
defaultTargets = ["CatalanMeasure", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

# Vendored from OpenAI's formalization of the irrationality of Catalan's constant
# (https://github.com/openai/math, commit fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb),
# converted to the module system.  See NOTICE.
[[lean_lib]]
name = "VendoredOAI"
globs = ["OAI.+"]

# Vendored from PrimeNumberTheoremAnd as patched by OpenAI's repository.  See NOTICE.
[[lean_lib]]
name = "VendoredPNT"
globs = ["PrimeNumberTheoremAnd.+"]

# The new development: the irrationality measure.
[[lean_lib]]
name = "CatalanMeasure"
roots = ["CatalanMeasure"]
globs = ["CatalanMeasure.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

# Historical theorems, superseded by the current bounds and not needed by
# CatalanMeasure/Challenge/Solution.  Not a default target; build with
# `lake build Archive`.  Modules are named CatalanArchive.CatalanMeasure.* (files live in
# archive/CatalanArchive/CatalanMeasure/*; Lake cannot share the CatalanMeasure namespace
# between two source directories, and Mathlib already owns the top-level `Archive` module prefix).  The main tree never imports the archive.
[[lean_lib]]
name = "Archive"
srcDir = "archive"
roots = ["CatalanArchive"]
globs = ["CatalanArchive.+"]
