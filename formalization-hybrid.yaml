  msc2020: ["11J82", "11J72"]

sources:
  - title: "Irrationality measures from Löwner determinants"
    type: original-proof
    relationship: other
    note: >-
      The companion paper by S. Litsey (2026), whose arguments the Lean
      development follows. LaTeX source and PDF are in paper-trigamma/
      (trigamma-irrationality-hexagon.tex is the single-file version); Hexagon
      preprint hexagon:2610.00401.
  - title: "Catalan's constant is irrational"
    authors:
      - "OpenAI"
    id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/preprints/Catalans-constant-is-irrational-September-24-2026"
    type: "preprint with Lean formalization"
    location: "https://github.com/openai/math"
    relationship: other
    note: >-
      Preprint dated September 24, 2026, released October 6, 2026. Supplies the
      determinant method (decay through Cauchy determinants and Andreief's
      identity, denominators bounded prime by prime) on which the measures are
      built. These proofs import no file of OAI/.
    license: "Apache-2.0"
    author_endorsement: not-contacted
  - title: "Arithmetic holonomy bounds and effective Diophantine approximation"
    authors:
      - "Frank Calegari"
      - "Vesselin Dimitrov"
      - "Yunqing Tang"
    id: "arXiv:2510.04156"
    type: preprint
    location: "https://arxiv.org/abs/2510.04156"
    relationship: background
    note: >-
      Theorem 5.1 gives mu(L(2, chi_{-3})) <= 24781, and the remark following it
      gives the same bound for rational linear combinations of L(2, chi_{-3}) and
      zeta(2). Not used in this proof.
    author_endorsement: not-contacted

related_formalizations:
  - id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/OAI/NumberTheory/Catalan"
    relationship: builds-on
    note: >-
      The determinant framework follows OpenAI's irrationality proof for
      Catalan's constant; no file of OAI/ is imported. The prime number theorem
      in arithmetic progressions is derived from the Wiener-Ikehara theorem in
      the files that OpenAI's repository adds to PrimeNumberTheoremAnd (vendored
      in PrimeNumberTheoremAnd/, see NOTICE).

status:
  scope: >-
    The twenty-five statements of ChallengeHybrid.lean (namespace
    TrigammaDifferences), with every constant written as a series, are fully
    proved in SolutionHybrid.lean from
    CatalanCore.Uniform.Bank.Plane1.plane_point_ab (the first plane),
    CatalanCore.Uniform.Bank.Plane2.plane2_point_ab_of_content (the second plane),
    CatalanCore.Uniform.Bank.Plane1.Dips.dip_point (the six special points
    L(2, chi_{-3}) +- 2 pi^2/27, +- pi^2/27, +- pi^2/18),
    CatalanCore.Uniform.Bank.Plane2.zeta3_measure_le,
    CatalanCore.Uniform.Bank.FourthsContent.Level3Bound.lambda_measure (whose Boolean
    argument selects the sign of 5 pi^2/48),
    CatalanCore.Uniform.Bank.Chi3.KContent.chi3_measure_L2_k,
    CatalanCore.Uniform.Bank.ThirdsContent.Level3Bound.thirds_plus_measure and
    thirds_minus_measure,
    CatalanCore.Uniform.Bank.FifthsContent.Level3Bound.fifths1_measure, ...,
    fifths4_measure, and
    CatalanCore.Uniform.Bank.HalvesContent.Bound.pi2_measure, and
    CatalanCore.Uniform.Bank.SeventhsContent.Level3Bound.sevenths_measure (whose
    argument a - 1 runs over Fin 6). Every theorem, proposition and lemma used in
    the proof of the companion paper's main theorem is formalized; its remarks
    and its section on the limits of the method are not. The solution has no
    sorry and no native_decide; #print axioms reports only propext,
    Classical.choice and Quot.sound. comparator-hybrid.json configures lake
    comparator for these statements; the CI workflow does not run it.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5", "Claude Haiku 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents wrote the mathematics, Lean proofs, certificate generators and text, using Python, Lean 4, Lake and Mathlib.
    - method: agent
      models: ["GPT-6.1 Sol (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        AI agents wrote the mathematics, Lean proofs, certificate generators and text, using Python, Lean 4, Lake and Mathlib.
  spend_usd: "subscription-based"
  notes: >-
    Both systems worked at the request of the human author, who posed the
    problems, directed the work and is responsible for the submission.
    Certificates use decide +kernel, without native_decide or additional axioms.

fidelity:
  divergences: >-
    None known. The constants are written out as series: G as
    sum_j (-1)^j/(2j+1)^2, L(2, chi_{-3}) as sum_k (1/(3k+1)^2 - 1/(3k+2)^2),
    zeta(3) as sum_{n>=0} 1/(n+1)^3, and psi'(a/q) - zeta(2) as
    sum_{n>=0} 1/(n + a/q)^2 - pi^2/6. Where the paper states a point in the
    notation Psi(s,t), the Lean statement is its classical form in the same
    row of the paper's Table 1, which differs from Psi(s,t) by a rational
    affine map. The three plane theorems take the rational coefficients a, b as
    arguments, with the fraction written p/q. Each bound is stated for all
    integer numerators and all sufficiently large denominators, with the
    exponents 206622/10000, 33520/100, 137046/10000, 47499/5000, 14, 15359/1000,
    18161/1000, 60382/10000, 65253/10000, 78219/2500, 14892/625 and
    18061719/10000 as rationals cast to R.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The statements in ChallengeHybrid.lean were checked against Theorems 1.1-1.5
    and Table 1 of the companion paper, and the constants stated in the paper were
    checked against the Lean development. No independent human review has been
    performed.

