# Formalization metadata for the hybrid results (separate from formalization.yaml, which describes the mu(G) result).
# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Irrationality measures for G -/+ 5 pi^2/48, L(2, chi_{-3}) and L(2, chi_{-3}) -/+ pi^2/9"
  description: >-
    For Catalan's constant G = sum_{j>=0} (-1)^j/(2j+1)^2 we prove mu(G - 5 pi^2/48) <= 32.44
    and mu(G + 5 pi^2/48) <= 32.44, and for L(2, chi_{-3}) = sum_{k>=0} (1/(3k+1)^2 - 1/(3k+2)^2)
    we prove mu(L(2, chi_{-3})) <= 14.35, and mu(L(2, chi_{-3}) + pi^2/9) <= 10.91 and
    mu(L(2, chi_{-3}) - pi^2/9) <= 10.91: for every e > 0, all large q and all p coprime to q,
    |x - p/q| > q^(-(E+e)). The proofs use rectangular, bordered Loewner matrices of digamma
    differences (library CatalanCore; the shifts 1/4, 3/4 give G, the shifts 1/3, 2/3 give
    L(2, chi_{-3}) together with a multiple of pi^2), nonvanishing modulo a prime and by characteristic-zero
    selection, decay from Cauchy determinants and Andreief's identity, and kernel-checked
    rational certificates.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J82", "11J72"]

related_formalizations:
  - id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/OAI/NumberTheory/Catalan"
    relationship: builds-on
    note: >-
      The Loewner/Cauchy-determinant framework follows OpenAI's irrationality proof for
      Catalan's constant; the prime number theorem in progressions is derived from the
      vendored PNT+ Wiener-Ikehara theorem. The L(2, chi_{-3}) development is otherwise independent.

status:
  scope: >-
    All five advertised statements are fully proved (SolutionHybrid.lean, via
    CatalanFrames.LambdaHybrid.lam_hyb_measure_final2, CatalanFrames.LambdaMirrorHybrid.mir_hyb_measure_final2
    and CatalanFrames.P6Hybrid.Quarter.chi3_measure, CatalanFrames.Thirds.chi3_plus_zeta2_measure
    and CatalanFrames.Thirds.chi3_minus_zeta2_measure). No sorry and
    no native_decide. Axioms: propext, Classical.choice, Quot.sound only.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

fidelity:
  divergences: >-
    None known. The constants are written out as series; the measure is stated for p coprime
    to q (IsCoprime p q) and q >= q0, with E = 811/25, 287/20 and 1091/100 as rationals cast to R.

review:
  status: "self-assessed"
  reviewers: []

alignment:
  namespace: "CatalanHybridChallenge"
  statements:
    - source: "Litsey (2026), hybrid measure for G - 5 pi^2/48, exponent 32.44"
      lean: "CatalanHybridChallenge.lam_hybrid_measure_3244"
      module: "ChallengeHybrid"
      status: proved
    - source: "Litsey (2026), hybrid measure for G + 5 pi^2/48, exponent 32.44"
      lean: "CatalanHybridChallenge.mir_hybrid_measure_3244"
      module: "ChallengeHybrid"
      status: proved
    - source: "Litsey (2026), hybrid measure for L(2, chi_{-3}), exponent 14.35"
      lean: "CatalanHybridChallenge.chi3_hybrid_measure_1435"
      module: "ChallengeHybrid"
      status: proved
    - source: "Litsey (2026), hybrid measure for L(2, chi_{-3}) + pi^2/9, exponent 10.91"
      lean: "CatalanHybridChallenge.chi3_plus_pi2_hybrid_measure_1091"
      module: "ChallengeHybrid"
      status: proved
    - source: "Litsey (2026), hybrid measure for L(2, chi_{-3}) - pi^2/9, exponent 10.91"
      lean: "CatalanHybridChallenge.chi3_minus_pi2_hybrid_measure_1091"
      module: "ChallengeHybrid"
      status: proved

sources:
  - title: "Irrationality measures for G -/+ 5 pi^2/48, L(2, chi_{-3}) and L(2, chi_{-3}) -/+ pi^2/9"
    type: original-proof
    relationship: other
    note: "Companion work by S. Litsey (2026)."

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Sonnet 5.5 (Anthropic)"]
      framework: "Claude Code desktop with native Windows shell and file tools, coordinating subagents"
      tool_setup: >-
        Claude agents produced the mathematics and the Lean development: the rectangular frames, the
        thirds frames for L(2, chi_{-3}) -/+ pi^2/9, content
        bounds and rank deficits, nonvanishing, the second-level deficit at non-clean primes with its
        weighted congruence, the decay estimate with the slope of the contour rays as a parameter, and
        the certificate with atoms on the support of an extremal dual measure (decide +kernel, no
        native_decide), using Python, Lean 4, Lake and Mathlib. The human author posed
        the problem, directed the work and checked the outcome.
    - method: agent
      models: ["OpenAI Codex"]
      framework: "Codex desktop with shell tools and parallel mathematical agents"
      tool_setup: >-
        Codex developed the valuation-one reduction and bounded-deletion transfer, the uniform
        rescaled-core deficit with its certified rational prime profile, the conductor-three periodic
        content profile with integral diagonal perturbation and principal-minor transfer, the
        characteristic-zero one-node selector, the quarter-border content profile with sixteen periodic
        D1 strips, and the kernel-checked 1600-atom analytic witness for L(2, chi_{-3}), with their
        generic Lean modules and export checks.
  notes: >-
    The shared library CatalanCore and the certificate tooling are described in
    archive/legacy-configs/formalization-lambda.yaml.

acknowledgements: >-
  OpenAI's proof and Lean formalization of the irrationality of Catalan's constant; Lean 4,
  Mathlib and the PNT+ project.
