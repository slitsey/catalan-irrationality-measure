# Formalization metadata for ChallengeHybrid.lean and SolutionHybrid.lean (the Löwner-determinant measures);
# formalization.yaml describes the mu(G) result.
# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Irrationality measures from Löwner determinants"
  description: >-
    For 0 < s < t <= 1 let Psi(s,t) = psi'(s) - psi'(t), where
    psi'(x) = sum_{n>=0} 1/(n+x)^2 is the trigamma function. We prove
    irrationality measures on three planes, the rational combinations of
    L(2, chi_{-3}) and pi^2, of zeta(3) and pi^2, and of zeta(3) and pi^4, with better bounds at
    special points, and for Psi(a/q,1) = psi'(a/q) - zeta(2) with q in {4,5,7}
    and gcd(a,q) = 1. With
    Catalan's constant G = sum_{j>=0} (-1)^j/(2j+1)^2 and
    L(2, chi_{-3}) = sum_{k>=0} (1/(3k+1)^2 - 1/(3k+2)^2), these are
    mu(a L(2, chi_{-3}) + b pi^2) <= 20.6622 and mu(a zeta(3) + b pi^2) <= 335.20
    and mu(a zeta(3) + b pi^4) <= 118 for all rationals a,b not both zero; mu(pi^4) <= 75; mu(L(2, chi_{-3})) <= 13.6839;
    mu(L(2, chi_{-3}) +- pi^2/9) <= 9.4913; mu(L(2, chi_{-3}) +- 2 pi^2/27) <= 14;
    mu(L(2, chi_{-3}) +- pi^2/27) <= 15.359; mu(L(2, chi_{-3}) +- pi^2/18) <= 17.492;
    mu(zeta(3)) <= 6.0382; mu(pi^2) <= 6.5214; mu(G +- 5 pi^2/48) <= 31.1973;
    mu(psi'(a/5) - pi^2/6) <= 23.7756 for a = 1, 2, 3, 4; and
    mu(psi'(a/7) - pi^2/6) <= 1806.1719 for a = 1, ..., 6.
    Each statement says: |x - a/b| > b^(-mu) for every integer a and every
    sufficiently large integer b, where mu is the exponent above. The
    approximations come from determinants of rectangular Loewner matrices of
    digamma differences at integer nodes, with a long common block and an
    interleaved border whose length is the only parameter of the geometry. The
    denominators are bounded prime by prime by a finite list of local bounds
    (assignment problems, the rank of the reduction modulo p, and windows of the
    border free of poles, where the reduction is translation invariant), each an
    explicit integer expression in the scale, the border, the prime and the
    first poles of the frame modulo p; one theorem turns a finite table of
    affine pieces, checked by comparisons of rational numbers, into the content
    estimate for every shift with the same denominator q, using the prime number
    theorem in arithmetic progressions. Nonvanishing follows from Hermite
    interpolation in characteristic zero, after deleting a bounded number of
    common nodes. The size is bounded with Andreief's identity and a lower bound
    for a discrete logarithmic energy, obtained from a comparison measure and
    verified on a finite cover by cells. All numerical bounds are ordinary
    kernel-checked rational proofs.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
