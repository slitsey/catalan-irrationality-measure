# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An irrationality measure for Catalan's constant"
  description: >-
    For Catalan's constant G = sum_{j >= 0} (-1)^j / (2j+1)^2, we prove that
    |G - a/b| > b^(-1981) for every integer a and every sufficiently large
    integer b, so the irrationality exponent of G is at most 1981. Replacing
    the prime number theorem by Chebyshev's bounds in the final step gives the
    exponent 5391, which is also formalized. The proof builds on OpenAI's
    proof and Lean formalization of the irrationality of G. OpenAI's
    determinant is viewed as a polynomial Delta_N(X) in the constant, whose
    degree is at most 44N. New uniform six-row dependencies in the leading
    prime residues save min(4N,63N-3p) denominator powers in the window
    58N <= 3p and p <= 21N. An injective kernel embedding and rank-nullity add
    3p-54N independent combinations for 18N <= p and 3p <= 58N. A continuous
    saving of exact integral 20/3,
    combined with the prime number theorem, lowers the common-denominator exponent. For large primes N it does not vanish at rational
    numbers whose denominator is not divisible by N squared. The new analytic ingredient is a perturbation
    estimate: for |x - G| <= exp(-366.3 N), |Delta_N(x) - Delta_N(G)| is at
    most OpenAI's bound for |Delta_N(G)|. This estimate is proved by a
    quadrature formula at Chebyshev nodes for the coefficient of the constant (with weights bounded on the unit circle), a mixed
    Andreief identity with fixed point columns, a generalized Vandermonde
    bound, and OpenAI's logarithmic-energy dual rerun for configurations with
    fewer points. A new certificate for the second case of OpenAI's energy
    dual, with re-optimized trial sequences and checked by Lean's kernel,
    improves OpenAI's real-place constant from 2.290939875 to 2.29180925.
    Retaining the product of (1+s) in the Vandermonde bound and combining two
    certified weighted energy endpoints, then retaining the fixed-node decay, lowers the perturbation exponent to 366.3.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J82", "11J72"]

sources:
  - title: "An irrationality measure for Catalan's constant: |G - a/b| > b^(-1981) for all large b"
    type: original-proof
    relationship: other
    note: >-
      The result is first presented together with this formalization, in the
      companion paper by S. Litsey, "An irrationality measure for Catalan's
      constant" (2026), whose arguments the Lean development follows. The repository
      contains the revised 1981 paper; Hexagon preprint hexagon:2610.00187v1 is the
      earlier 8127 version, and this revision has not been uploaded there.
  - title: "Catalan's constant is irrational"
    authors:
      - "OpenAI"
    id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/preprints/Catalans-constant-is-irrational-September-24-2026"
    type: "preprint with Lean formalization"
    location: "https://github.com/openai/math"
    relationship: other
    note: >-
      Supplies the determinant, the local estimates, the nonvanishing argument,
      the real-place sheet bounds and the certified energy dual on which the
      measure is built. Its Lean formalization is vendored in OAI/ (see NOTICE);
      the comparison constants of 37 certificate files are sharpened.
      The irrationality measure itself is not in that work.
    license: "Apache-2.0"
    author_endorsement: not-contacted
  - title: "A finite irrationality measure for Catalan's constant"
    authors:
      - "Rohit Kumar Jha"
    id: "doi:10.5281/zenodo.23237269"
    type: preprint
    location: "https://doi.org/10.5281/zenodo.23237269"
    relationship: background
    note: >-
      Earlier and independent proof of the weaker bound mu(G) <= 10^8, also
      formalized in Lean on top of OpenAI's work. Not used in this proof.
    author_endorsement: not-contacted

related_formalizations:
  - id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/OAI/NumberTheory/Catalan"
    relationship: builds-on
    note: >-
      OpenAI's formalization of the irrationality of Catalan's constant. The
      478 original files of it (and 10 files OpenAI added to
      PrimeNumberTheoremAnd) are vendored here, mechanically converted to Lean's
      module system and moved from Lean v4.34.1 to v4.35.0-rc2. Apart from
      sharper comparison constants in 37 certificate files, their
      mathematical content is unchanged. Generic determinant lemmas were moved
      unchanged to a new RealDeterminantCore file (479 OAI files in total), and
      generic denominator lemmas were copied out to remove unused certificate imports.
  - id: "https://github.com/rohitkrjha/catalan-measure"
    relationship: independent
    note: >-
      Jha's formalization of mu(G) <= 10^8, built independently on OpenAI's
      formalization. No code is shared.

status:
  scope: >-
    Both advertised statements are fully proved, with Catalan's constant
    written out as the series in Challenge.lean. Every lemma of the companion
    paper is formalized, including the perturbation estimate with rho = 366.3 and
    the irrationality-measure criterion. The prime number theorem used in the
    1981 version comes from OpenAI's vendored formalization. The paper's
    remarks about the limits of the method are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Claude agentic workspace (cloud Linux container with shell and file tools)"
      tool_setup: >-
        The AI model produced the mathematics, all Lean code, the module
        conversion and the companion paper, using Lean 4, Lake and Mathlib from
        the command line. The human author posed the problem, directed the
        work and checked the outcome.
      cost:
        wall_time: "about two days of elapsed time"
        spend_usd: "subscription-based"
        hardware: "cloud container with 2 CPU cores and 8 GB RAM"
      prompting_notes: >-
        High-level instructions only, for example to upgrade OpenAI's
        irrationality proof to an irrationality measure, to prove the
        perturbation lemma in Lean without sorry, and to prepare the result
        for Palomar.
    - method: agent
      models: ["OpenAI Codex (GPT-6)"]
      framework: "Codex desktop with native Windows shell and file tools"
      tool_setup: >-
        Numerical screening with Python, NumPy and SciPy; exact rational certificate
        generation; Lean and Lake on the pinned toolchain; direct independent-kernel
        diagnostics; LaTeX compilation and PDF rendering. New certificates use
        decide +kernel, without native_decide or additional axioms.
      prompting_notes: >-
        The author requested assessment of Claude's research handoff, investigation
        of ideas 1 and 4, formalization of a tighter bound, a revised paper, and
        resolution of CI issues for Palomar submission.
  spend_usd: "subscription-based"
  notes: >-
    The original mathematical and formal content was produced by Claude Opus 5.5.
    The weighted Vandermonde refinement, fixed-node decay bound, and paper revision were developed with OpenAI
    Codex, along with the square-denominator nonvanishing, prime-window refinement,
    and uniform sparse prime-row dependencies, injective combined-row kernel embeddings,
    and denominator saving. Both worked at the request of the human author, who is responsible for the submission.
    The current 1981/5391 checkpoint passes the main Lean kernel and standard-axiom
    audits. Independent-kernel and Comparator acceptance remain pending; the author
    deferred CI and Palomar optimization until bound-reduction research stalls.

fidelity:
  divergences: >-
    None known. The Lean statements are the paper's Theorem 1.1 in the form
    "for all sufficiently large b and all integers a" (Filter.atTop), which is
    the definition of an irrationality-measure bound.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The statements in Challenge.lean were checked against the companion paper.
    Every constant in the paper was recomputed against the Lean development.
    No independent human review has been performed.

alignment:
  namespace: "CatalanIrrationalityMeasure"
  statements:
    - source: "Litsey (2026), Theorem 1.1, first statement"
      lean: "CatalanIrrationalityMeasure.catalan_irrationalityMeasure_1981"
      module: "Challenge"
      status: proved
      note: "For all large b and all integers a, b^(-1981) < |G - a/b|."
    - source: "Litsey (2026), Theorem 1.1, second statement (Chebyshev version)"
      lean: "CatalanIrrationalityMeasure.catalan_irrationalityMeasure_5391"
      module: "Challenge"
      status: proved
      note: "For all large b and all integers a, b^(-5391) < |G - a/b|."

acknowledgements: >-
  OpenAI's formalization of the irrationality of Catalan's constant; the
  PrimeNumberTheoremAnd project; Mathlib; the Lean FRO.
