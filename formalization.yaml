# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An irrationality measure for Catalan's constant"
  description: >-
    For Catalan's constant G = sum_{j >= 0} (-1)^j / (2j+1)^2, we prove
    |G-a/b| > b^(-590) for every integer a and all sufficiently large b, so the
    irrationality exponent of G is at most 590. The proof uses OpenAI's
    determinant construction for an arbitrary design of five integer parameters,
    here (58,9,3,5,3), with a determinant of size 58N whose value is a polynomial
    of degree 53N in the constant. A Gauss-type quadrature formula with 53N nodes
    and an Andreief identity with fixed points bound the determinant on an
    interval of length exp(-rho N) around G, with rho = 301.54258... Closed-form
    rank deficiencies of the reduced matrix modulo the primes 12N < p <= 26N,
    proved with antisymmetric row combinations, a reflection of Chebyshev
    polynomials modulo p and Frobenius relations, make the coefficients divisible
    by prime powers, a gain of 35369/1848 in units of N^2. The energy estimate
    uses trial sequences with 160 Chebyshev coefficients and 75 geometric terms,
    41 of them complex, verified on cells with an exact local Taylor expansion.
    The decay rate is eta = 27.124717..., and the criterion with a free lower end
    of the window of primes gives the limiting exponent 53 rho / eta = 589.19...
    Denominator and content asymptotics and the choice of the prime use the prime
    number theorem. All numerical bounds are ordinary kernel-checked rational
    proofs.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J82", "11J72"]

sources:
  - title: "An irrationality measure for Catalan's constant"
    type: original-proof
    relationship: other
    note: >-
      The companion paper by S. Litsey (2026), whose arguments the Lean
      development follows. LaTeX source and PDF are in paper/
      (catalan-measure-hexagon.tex is the single-file version); Hexagon preprint
      hexagon:2610.00187.
  - title: "Catalan's constant is irrational"
    authors:
      - "OpenAI"
    id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/preprints/Catalans-constant-is-irrational-September-24-2026"
    type: "preprint with Lean formalization"
    location: "https://github.com/openai/math"
    relationship: other
    note: >-
      Preprint dated September 24, 2026, released October 6, 2026. Supplies the
      determinant construction, the local estimates, the nonvanishing argument and
      the energy method at the real place on which the measure is built. Its Lean
      formalization is vendored in OAI/ (see NOTICE). The irrationality measure
      itself is not in that work.
    license: "Apache-2.0"
    author_endorsement: not-contacted
  - title: "A finite irrationality measure for Catalan's constant"
    authors:
      - "Rohit Kumar Jha"
    id: "doi:10.5281/zenodo.23237269"
    type: preprint
    location: "https://doi.org/10.5281/zenodo.23237269"
    relationship: background
    note: >-
      Independent proof of mu(G) <= 10^8, also formalized in Lean on top of
      OpenAI's work. Not used in this proof.
    author_endorsement: not-contacted
  - title: "General designs and an irrationality exponent for Catalan's constant"
    authors:
      - "Marcos Costa Santos Carreira"
    id: "doi:10.5281/zenodo.23532239"
    type: preprint
    location: "https://github.com/MarcosCarreira/catalan-designs"
    relationship: background
    note: >-
      Five-parameter determinant designs, the bound mu(G) < 2294 and a
      two-measure equilibrium formulation of the real-place constant; cited in
      the companion paper. No code or theorem from that work is imported.
    author_endorsement: not-contacted

related_formalizations:
  - id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/OAI/NumberTheory/Catalan"
    relationship: builds-on
    note: >-
      OpenAI's formalization of the irrationality of Catalan's constant. The files
      used here (479 in OAI/, and 10 files OpenAI added to PrimeNumberTheoremAnd)
      are vendored, converted to Lean's module system and ported from Lean v4.34.1
      to v4.35.0-rc2. Apart from comparison constants given to seven digits in 37
      certificate files, their mathematical content is unchanged.
  - id: "https://github.com/rohitkrjha/catalan-measure"
    relationship: independent
    note: >-
      Jha's formalization of mu(G) <= 10^8, built independently on OpenAI's
      formalization. No code is shared.

status:
  scope: >-
    The statement in Challenge.lean, with Catalan's constant written as a series,
    is fully proved in Solution.lean by CatalanMeasure.GenD.D58.catalan_irrationalityMeasure_590.
    Every lemma of the companion paper used for this theorem is formalized,
    including the degree and denominator bounds, the nonvanishing, the four rank
    deficiencies and the divisibility of the coefficients, the quadrature
    perturbation estimate, the energy bounds and their numerical certificates, and
    the final choice of the prime. The prime number theorem comes from the PNT+
    project through OpenAI's vendored formalization. The paper's remarks on the
    limits of the method are not formalized. The solution has no sorry and no
    native_decide; #print axioms reports only propext, Classical.choice and
    Quot.sound. comparator.json configures lake comparator for this statement;
    Comparator has not been run (it requires Linux).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Sonnet 5.5 (Anthropic)"]
      framework: "Claude Code with shell and file tools"
      tool_setup: >-
        Claude produced the measure framework for arbitrary designs and the
        perturbation estimate by quadrature, the closed-form rank deficiencies on
        the windows of primes with their consequences for the coefficients, the
        trial sequences with complex geometric terms, their verification on cells
        and the K = 160 certificate of the design (58,9,3,5,3), the final
        assembly, the module conversion, the corresponding Lean proofs and the
        companion paper, using Python, Lean 4, Lake and Mathlib.
    - method: agent
      models: ["OpenAI Codex (GPT-6)"]
      framework: "Codex desktop with shell and file tools"
      tool_setup: >-
        Codex produced the determinant with its local arithmetic and
        nonvanishing, the energy estimates with fixed columns and the first trial,
        the quadrature nodes and the weight bound, the divisibility of the
        coefficients by prime squares and the choice of the largest admissible
        prime, the rank deficiency by antisymmetric row combinations, and the
        corresponding Lean proofs and certificate generators.
  spend_usd: "subscription-based"
  notes: >-
    Both systems worked at the request of the human author, who posed the problem,
    directed the work and is responsible for the submission. New certificates use
    decide +kernel, without native_decide or additional axioms.

fidelity:
  divergences: >-
    None known. The Lean statement is the paper's Theorem 1.1 in the form
    "for all sufficiently large b and all integers a" (Filter.atTop), which is
    the definition of an irrationality-measure bound.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The statement in Challenge.lean was checked against the companion paper, and
    the constants, definitions and hypotheses stated in the paper were checked
    against the Lean development. No independent human review has been performed.

alignment:
  namespace: "CatalanIrrationalityMeasure"
  statements:
    - source: "Litsey (2026), Theorem 1.1"
      lean: "CatalanIrrationalityMeasure.catalan_irrationalityMeasure_590"
      module: "Challenge"
      status: proved
      note: "For all large b and all integers a, b^(-590) < |G - a/b|."

acknowledgements: >-
  OpenAI's formalization of the irrationality of Catalan's constant; the
  PrimeNumberTheoremAnd project; Mathlib; the Lean FRO.
