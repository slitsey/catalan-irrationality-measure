# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An irrationality measure for Catalan's constant"
  description: >-
    For Catalan's constant G = sum_{j >= 0} (-1)^j / (2j+1)^2, we prove
    |G-a/b| > b^(-270) for every integer a and all sufficiently large b, so the
    irrationality exponent of G is at most 270. The proof uses OpenAI's
    determinant construction for general parameters, here the design
    (58,9,3,5,3), with a determinant of size 58N whose value is a polynomial of
    degree at most 53N in the constant. At a prime p each unit of corank modulo p
    of the matrix of rational parts lowers the denominator by a factor p. Closed
    formulas and one counting inequality, applied on the remaining intervals of
    primes to every constant subspace at once, with upper bounds for ranks from
    forced intersections of row spaces, give a piecewise linear profile of area
    at least 22.0607 in units of N^2. At the real place, a phase inequality for
    Pick matrices, proved by interpolation with a finite Blaschke product, shows
    that the determinant det L of OpenAI's integrand loses only a factor 499^n
    when the weight of the positive nodes is replaced by 0, as soon as a phase
    statistic of the nodes is large enough. The statistic is large on every
    configuration close to the maximum of OpenAI's energy, and OpenAI's bound
    suffices on the others. With weight 0 the determinant factors through two Gram
    determinants, which Fischer's inequality and a finite Andreief identity bound
    by two logarithmic gases, and tangent inequalities against fixed reference
    measures bound the gases. This adds 24.64 to the decay rate. A quadrature
    formula with 53N nodes, the Chebyshev nodes of 106 short intervals whose
    Lagrange polynomials are bounded by the Green functions of the intervals,
    extends the bound to an interval of length exp(-rho N) around G, with
    rho = 278.376313578. The weight of each replaced column and its generalized
    Vandermonde factor are bounded together: a weighted Hadamard inequality with
    parameter 3/4 makes the dependence on the column cancel, and one contour of
    radius 3/4 serves all columns. The node-dependent part of the weight is
    bounded by a chord table and enters the energy bound as an external field.
    The energy estimates use trial sequences given by logarithmic potentials of
    point charges, which move linearly with the fraction of prescribed columns.
    The fields of the reference measures are bounded by polynomial majorants and
    exact sum of squares identities. The decay rate is eta = 54.68745, and a
    criterion with a free lower end of the window of primes gives the exponent
    270: its last condition reads
    270 > d rho / (eta - 4 d delta) = 269.78696... with d = 53 and delta = 2.9e-7.
    Denominator and content asymptotics and the choice of the prime use the prime
    number theorem. All numerical bounds are ordinary kernel-checked rational
    proofs.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J82", "11J72"]

sources:
  - title: "An irrationality measure for Catalan's constant"
    type: original-proof
    relationship: other
    note: >-
      The companion paper by S. Litsey (2026), whose arguments the Lean
      development follows. LaTeX source and PDF are in paper/
      (catalan-measure-hexagon.tex is the single-file version); Hexagon preprint
      hexagon:2610.00187.
  - title: "Catalan's constant is irrational"
    authors:
      - "OpenAI"
    id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/preprints/Catalans-constant-is-irrational-September-24-2026"
    type: "preprint with Lean formalization"
    location: "https://github.com/openai/math"
    relationship: other
    note: >-
      Preprint dated September 24, 2026, released October 6, 2026. Supplies the
      determinant construction, the local estimates, the nonvanishing argument and
      the energy method at the real place on which the measure is built. Its Lean
      formalization is vendored in OAI/ (see NOTICE). The irrationality measure
      itself is not in that work.
    license: "Apache-2.0"
    author_endorsement: not-contacted
  - title: "Lean formalization of an irrationality measure for Catalan's constant"
    authors:
      - "Cinna Davis"
    id: "https://github.com/1337isnot1337/catalan-constant/tree/3c4515314bda407d032cb55f60bfc56b03c1d3f9"
    type: "Lean formalization"
    location: "https://github.com/1337isnot1337/catalan-constant"
    relationship: other
    note: >-
      Supplies two lemmas on the weights of nodal polynomials. Two files of
      commit 3c45153, GeneralNodalWeights.lean and NodalRootDeletion.lean, are
      ported into CatalanMeasure/GenD/Signed/Davis/ with declarations and proofs
      unchanged and are used by the proof; the other 31 ported files are in
      archive/ and are not part of the build. See NOTICE and PROVENANCE.json
      there.
    license: "Apache-2.0"
    author_endorsement: not-contacted
  - title: "A finite irrationality measure for Catalan's constant"
    authors:
      - "Rohit Kumar Jha"
    id: "doi:10.5281/zenodo.23237269"
    type: preprint
    location: "https://doi.org/10.5281/zenodo.23237269"
    relationship: background
    note: >-
      Independent proof of mu(G) <= 10^8, also formalized in Lean on top of
      OpenAI's work. Not used in this proof.
    author_endorsement: not-contacted
  - title: "General designs and an irrationality exponent for Catalan's constant"
    authors:
      - "Marcos Costa Santos Carreira"
    id: "doi:10.5281/zenodo.23532239"
    type: preprint
    location: "https://github.com/MarcosCarreira/catalan-designs"
    relationship: background
    note: >-
      Five-parameter determinant designs, the bound mu(G) < 2294 and a
      two-measure equilibrium formulation of the real-place constant; cited in
      the companion paper. No code or theorem from that work is imported.
    author_endorsement: not-contacted

related_formalizations:
  - id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/OAI/NumberTheory/Catalan"
    relationship: builds-on
    note: >-
      OpenAI's formalization of the irrationality of Catalan's constant. 479
      files of it are vendored in OAI/, of which the proof imports 117, together
      with the 10 files that OpenAI adds to PrimeNumberTheoremAnd; they were
      converted to Lean's module system and ported from Lean v4.34.1 to
      v4.35.0-rc2. Apart from comparison constants given to seven digits in 37
      certificate files, which the proof does not import, their mathematical
      content is unchanged.
  - id: "https://github.com/1337isnot1337/catalan-constant/tree/3c4515314bda407d032cb55f60bfc56b03c1d3f9"
    relationship: builds-on
    note: >-
      Cinna Davis's formalization of mu(G) <= 528.23288. Two of its files
      (commit 3c45153), on the weights of nodal polynomials, are ported into
      CatalanMeasure/GenD/Signed/Davis/ with declarations and proofs unchanged
      and are used by the proof.
  - id: "https://github.com/rohitkrjha/catalan-measure"
    relationship: independent
    note: >-
      Jha's formalization of mu(G) <= 10^8, built independently on OpenAI's
      formalization. No code is shared.

status:
  scope: >-
    The statement in Challenge.lean, with Catalan's constant written as a series,
    is fully proved in Solution.lean by
    CatalanMeasure.GenD.Signed.RouteI.Measure270.catalan_irrationalityMeasure_270.
    Every result of the companion paper is formalized, including the degree and
    denominator bounds, the nonvanishing, the closed formulas, the counting
    inequality and its application to every constant subspace with the rank data,
    the divisibility of the coefficients, the phase inequality for Pick matrices,
    the Gram and logarithmic gas bounds for the row determinant, the quadrature
    perturbation estimate, the energy bounds, the reference measures and their
    numerical certificates, and the criterion with the choice of the prime. The
    prime number theorem comes from the PNT+ project through OpenAI's vendored
    formalization. The paper's remarks on the method are not formalized. The
    solution has no sorry and no native_decide; #print axioms reports only
    propext, Classical.choice and Quot.sound. The proof is kernel-checked: Lean's
    kernel accepts every declaration. comparator.json configures lake comparator
    for this statement, but the proof has not been run through it.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5", "Claude Haiku 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents wrote the mathematics, Lean proofs, certificate generators and text, using Python, Lean 4, Lake and Mathlib.
    - method: agent
      models: ["GPT-6.1 Sol (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        AI agents wrote the mathematics, Lean proofs, certificate generators and text, using Python, Lean 4, Lake and Mathlib.
  spend_usd: "subscription-based"
  notes: >-
    Both systems worked at the request of the human author, who posed the problem,
    directed the work and is responsible for the submission. New certificates use
    decide +kernel, without native_decide or additional axioms.

fidelity:
  divergences: >-
    None known. The Lean statement is the paper's Theorem 1.1 in the form
    "for all sufficiently large b and all integers a" (Filter.atTop), which is
    the definition of an irrationality-measure bound.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The statement in Challenge.lean was checked against the companion paper, and
    the constants, definitions and hypotheses stated in the paper were checked
    against the Lean development. No independent human review has been performed.

alignment:
  namespace: "CatalanIrrationalityMeasure"
  statements:
    - source: "Litsey (2026), Theorem 1.1"
      lean: "CatalanIrrationalityMeasure.catalan_irrationalityMeasure_270"
      module: "Challenge"
      status: proved
      note: "For all large b and all integers a, b^(-270) < |G - a/b|."

acknowledgements: >-
  OpenAI's formalization of the irrationality of Catalan's constant; Cinna
  Davis's formalization, for the weights of nodal polynomials; the PrimeNumberTheoremAnd project; Mathlib; the Lean FRO.
