# Formalization metadata for the L(2, chi_{-3}) result (separate from formalization.yaml and formalization-lambda.yaml).
# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Irrationality and an irrationality measure for L(2, chi_{-3})"
  description: >-
    For L(2, chi_{-3}) = sum_{k>=0} (1/(3k+1)^2 - 1/(3k+2)^2) we prove that it is irrational and
    that |L - p/q| > q^(-(M+e)) for every e > 0, all large q and all p coprime to q, with
    M = 142297183/3910000 (about 36.393); in particular |L - p/q| > q^(-37).
    The proof uses the Loewner-matrix (Hurwitz zeta) frame of dimension 3 with weights
    (1, 2, -3) at nodes (1, 1/3, 1/2), an ell-adic Krylov/Schur-complement nonvanishing argument
    for primes ell = 1 mod 6 (Theorem A, Lemma 3), a Cauchy-determinant decay estimate and the
    kernel-checked rational certificate with D_cert = 30002/10000, c_cert = 68726/10000
    and content exponent 67/24.
  authors:
    - "Sean Litsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sean Litsey"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J82", "11J72"]

related_formalizations:
  - id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/OAI/NumberTheory/Catalan"
    relationship: builds-on
    note: >-
      The Loewner/Cauchy-determinant framework follows OpenAI's irrationality proof for
      Catalan's constant; the prime number theorem in progressions is derived from the
      vendored PNT+ Wiener-Ikehara theorem. The L(2, chi_{-3}) development is otherwise independent.

status:
  scope: >-
    All three advertised statements are fully proved (SolutionChi3.lean, via
    CatalanFrames/P6/Final.lean). No sorry and no native_decide.
    Axioms: propext, Classical.choice, Quot.sound only.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

fidelity:
  divergences: >-
    None known. L(2, chi_{-3}) is written out as the series sum_k (1/(3k+1)^2 - 1/(3k+2)^2).
    The measure is stated for p coprime to q (Nat.Coprime p.natAbs q) and q >= q0.

review:
  status: "self-assessed"
  reviewers: []

alignment:
  namespace: "CatalanChi3Challenge"
  statements:
    - source: "Litsey (2026), irrationality of L(2, chi_{-3})"
      lean: "CatalanChi3Challenge.chi3_irrational"
      module: "ChallengeChi3"
      status: proved
    - source: "Litsey (2026), irrationality measure of L(2, chi_{-3}), exponent M + e"
      lean: "CatalanChi3Challenge.chi3_irrationalityMeasure"
      module: "ChallengeChi3"
      status: proved
      note: "M = 142297183/3910000 = c_cert (1/(D_cert - 67/24) + 1/2) for g1 = g2 = 1/2, s = 1."
    - source: "Litsey (2026), round exponent 37"
      lean: "CatalanChi3Challenge.chi3_irrationalityMeasure_37"
      module: "ChallengeChi3"
      status: proved

sources:
  - title: "Irrationality and an irrationality measure for L(2, chi_{-3})"
    type: original-proof
    relationship: other
    note: "Companion work by S. Litsey (2026)."

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Sonnet 5.5 (Anthropic)"]
      framework: "Claude Code desktop with native Windows shell and file tools, coordinating subagents"
      tool_setup: >-
        Claude agents produced the mathematics and the Lean development, including the
        kernel-checked numerical certificate (decide +kernel, no native_decide), using Python,
        Lean 4, Lake and Mathlib. The human author posed the problem, directed the work and
        checked the outcome.
  notes: >-
    The shared modular engine (CatalanCore) and certificate tooling are described in
    formalization-lambda.yaml.

acknowledgements: >-
  OpenAI's proof and Lean formalization of the irrationality of Catalan's constant; Lean 4,
  Mathlib and the PNT+ project.
